name: hacker-news

services:
  frontend:
    image: hacker-news-frontend:20-alpine
    container_name: hacker-news-frontend
    build:
      context: .
      args:
        API_URL: ${API_URL}
      dockerfile: ./app/frontend/Dockerfile
    environment:
      - NODE_ENV=production
    env_file:
      - ./app/frontend/.env
    ports:
      - '80:80'
    depends_on:
      - backend

  backend:
    image: hacker-news-backend:20-alpine
    container_name: hacker-news-backend
    build:
      context: .
      dockerfile: ./app/backend/Dockerfile
    environment:
      - NODE_ENV=production
    env_file:
      - ./app/backend/.env
    ports:
      - '3001:3001'
    depends_on:
      - database

  database:
    image: postgres:16-alpine
    container_name: hacker-news-postgres
    env_file:
      - ./app/backend/.env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
