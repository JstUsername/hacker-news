version: '3.9'

name: 'hacker-news'

services:
  database:
    image: 'postgres:16-alpine'
    container_name: hacker-news-postgres
    restart: always
    env_file:
      - ./app/backend/.env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
