apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hacker-news-postgres-stateful-set
spec:
  selector:
    matchLabels:
      app: hacker-news-postgres
  serviceName: postgres
  replicas: 1
  template:
    metadata:
      labels:
        app: hacker-news-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: hacker-news-backend-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
